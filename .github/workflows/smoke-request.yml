name: superagent smoke request
# 冒烟用：以 github-actions[bot] 身份开一个请求 issue。
# 每次只把 SMOKE.md 里的计数 +1（单调递进，永不撤销既有改动），因此不会被 Eval 判成重复或方向不明。
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open request issue as github-actions[bot]
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=$(sed -n 's/^smoke run: *\([0-9][0-9]*\)$/\1/p' SMOKE.md | head -1)
          N=${N:-0}
          NEXT=$((N + 1))
          cat > /tmp/body.md <<BODY
          @kentlee517 Please change the line

          \`smoke run: $N\`

          in SMOKE.md to

          \`smoke run: $NEXT\`

          This is a copy-only change. Do not modify any other file or any other content.
          BODY
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "SMOKE: bump run counter to $NEXT" \
            --body-file /tmp/body.md
