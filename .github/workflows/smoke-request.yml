name: superagent smoke request
# 冒烟用：以 github-actions[bot] 身份开一个请求 issue。
# 请求方向按 README 当前内容交替，保证每次都是「尚未交付的改动」，不会被 Eval 判成重复。
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open request issue as github-actions[bot]
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          A='Welcome to the superagent smoke test.'
          B='Welcome to the smoke test repository.'
          if grep -qF "$A" README.md; then OLD="$A"; NEW="$B"; else OLD="$B"; NEW="$A"; fi
          {
            echo "@kentlee517 Please fix the wording in README.md: change the line"
            echo
            echo "\`$OLD\`"
            echo
            echo "to"
            echo
            echo "\`$NEW\`"
            echo
            echo "This is a copy-only change. Do not modify any other file or any other content."
          } > /tmp/body.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "README: fix the greeting wording (bot)" \
            --body-file /tmp/body.md
